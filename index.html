<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Essential Men | Tienda Masculina</title>

    <!-- Vinculamos los estilos -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Vinculamos JavaScript -->
    <script src="js/main.js" defer></script>
</head>

<body>

    <header class="encabezado">
        <div class="contenedor">
            <p class="marca">ESSENTIAL <span>MEN</span></p>
            <p class="subtitulo">Estilo que define tu identidad.</p>
        </div>
    </header>

    <main class="contenedor">

        <section class="presentacion">
            <p class="etiqueta">COLECCIÓN MASCULINA</p>
            <h1>Tu estilo, <span>tu elección.</span></h1>
            <p>Administrá los productos de nuestra tienda.</p>
        </section>

        <!-- Formulario para agregar productos -->
        <section class="panel">

            <h2>Agregar producto</h2>

            <form id="formulario-producto">

                <div class="campos">

                    <div class="campo">
                        <label for="nombre">Nombre del producto</label>
                        <input
                            type="text"
                            id="nombre"
                            placeholder="Ej.: Reloj Tressa"
                            required
                            maxlength="80"
                        >
                    </div>

                    <div class="campo">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" required>
                            <option value="">Seleccioná una categoría</option>
                            <option value="Relojes">Relojes</option>
                            <option value="Gafas">Gafas de sol</option>
                            <option value="Remeras">Remeras</option>
                            <option value="Shorts">Shorts</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="precio">Precio ($)</label>
                        <input
                            type="number"
                            id="precio"
                            placeholder="Ej.: 85000"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="stock">Stock disponible</label>
                        <input
                            type="number"
                            id="stock"
                            placeholder="Ej.: 10"
                            min="0"
                            step="1"
                            required
                        >
                    </div>

                </div>

                <button type="submit" class="boton boton-principal">
                    + Agregar producto
                </button>

            </form>

            <!-- Aquí mostramos las confirmaciones -->
            <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

        </section>

        <!-- Catálogo -->
        <section class="catalogo">

            <div class="catalogo-encabezado">
                <div>
                    <p class="etiqueta">NUESTROS PRODUCTOS</p>
                    <h2>Catálogo</h2>
                </div>

                <span id="contador" class="contador">0 productos</span>
            </div>

            <!-- Buscador -->
            <div class="buscador">
                <label for="busqueda">Buscar en el catálogo</label>

                <input
                    type="search"
                    id="busqueda"
                    placeholder="Buscá por nombre o categoría..."
                >
            </div>

            <!-- JavaScript dibujará los productos aquí -->
            <div id="lista-productos" class="lista-productos"></div>

        </section>

    </main>

    <footer class="pie">
        <p>ESSENTIAL MEN &copy; 2026 | Simulador de tienda masculina</p>
    </footer>

</body>

</html>
